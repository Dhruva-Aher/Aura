# Always-on production stack for a VPS (Hetzner / DigitalOcean / etc.)
# Usage:
#   cp deploy/env.example .env.prod
#   # edit DOMAIN + POSTGRES_PASSWORD
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-aura}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - aura

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - aura

  api:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aura}?schema=public
      REDIS_URL: redis://redis:6379
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "npm run db:push && npm run start -w api"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/healthz"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    expose:
      - "3001"
    networks:
      - aura

  worker:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aura}?schema=public
      REDIS_URL: redis://redis:6379
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEFAULT_WORKERS: ${DEFAULT_WORKERS:-2}
      HIGH_WORKERS: ${HIGH_WORKERS:-1}
      LOW_WORKERS: ${LOW_WORKERS:-1}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-20}
    depends_on:
      api:
        condition: service_healthy
    command: ["npm", "run", "start", "-w", "worker"]
    networks:
      - aura

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.prod (e.g. api.yourdomain.com)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - aura

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  aura:
    driver: bridge

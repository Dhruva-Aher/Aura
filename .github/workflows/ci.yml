name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  worker-tests:
    name: Worker unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Test worker suite
        run: npm test -w apps/worker

# Railway build + start config for the worker service.
# Root directory for this Railway service should be set to: apps/worker
#
# Build: only generate Prisma client — TypeScript is run directly via tsx,
#        so we never need to compile to dist/.
# Start: npm start → tsx src/index.ts (defined in package.json)

[phases.build]
cmds = ["cd ../.. && npm run db:generate"]

[start]
cmd = "npm start"
